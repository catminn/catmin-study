name: Knowledge-driven story drafts
on:
  pull_request:
    paths:
      - 'src/knowledge-story-drafts.ts'
      - 'test/knowledge-story-drafts.test.mjs'
      - '.github/workflows/knowledge-story-drafts.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test test/knowledge-story-drafts.test.mjs test/learning-adapter.test.mjs
