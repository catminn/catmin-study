name: World Manifest Authoring
on:
  pull_request:
    paths:
      - 'content/contracts/world-manifest-authoring-v1.json'
      - 'test/lib/world-manifest-validator.mjs'
      - 'test/world-manifest.test.mjs'
      - '.github/workflows/world-manifest.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/world-manifest.test.mjs
