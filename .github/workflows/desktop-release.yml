# 学习空间桌面版：打 v* 标签时在 Windows 上打包，并发布到 GitHub Releases（桌面程序从这里自动更新）
name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 打包后用 gh 把安装包、blockmap、latest.yml 传到 v<版本号> 的 release（自动更新读 latest.yml）
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: upload release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=v$(node -p "require('./package.json').version")
          gh release view $VER >/dev/null 2>&1 || gh release create $VER --target $GITHUB_SHA --title "学习空间 $VER" --notes "桌面版 $VER"
          gh release upload $VER dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          gh release edit $VER --draft=false --latest
