# 学习空间桌面版：打 v* 标签时在 Windows 上打包，并发布到 GitHub Releases（桌面程序从这里自动更新）
name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 先建好草稿 release（带标签），electron-builder 往里传安装包和 latest.yml，最后再正式发布
      - name: draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=v$(node -p "require('./package.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          gh release view $VER >/dev/null 2>&1 || gh release create $VER --draft --target $GITHUB_SHA --title "学习空间 $VER" --notes "桌面版 $VER"
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $VER --draft=false --latest
