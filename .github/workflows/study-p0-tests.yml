name: Study RPG P0 checks
on:
  pull_request:
    paths:
      - 'public/study-core.mjs'
      - 'scripts/audit-legacy-save.mjs'
      - 'test/study-core.test.mjs'
      - 'test/audit-legacy-save.test.mjs'
      - 'test/world01-structure.test.mjs'
      - 'scripts/validate-story-bundle.mjs'
      - 'test/validate-story-bundle.test.mjs'
      - 'content/contracts/world01-opening-skeleton.json'
      - 'scripts/validate-world01-route-agency.mjs'
      - 'scripts/check-world01-public-contract.mjs'
      - 'test/world01-route-agency.test.mjs'
      - 'test/world01-public-contract.test.mjs'
      - 'test/world01-causal-authoring.test.mjs'
      - 'test/fixtures/world01-causal-authoring-v1.json'
      - 'content/contracts/world01-route-agency-v1.md'
      - 'scripts/validate-dm-beat-flow.mjs'
      - 'scripts/validate-scene-learning-flow.mjs'
      - 'scripts/validate-scene-learning-pacing.mjs'
      - 'scripts/validate-dm-failure-forward.mjs'
      - 'scripts/npc-testimony-reference.mjs'
      - 'scripts/npc-dialogue-comparison.mjs'
      - 'test/dm-beat-flow.test.mjs'
      - 'test/dm-beat-sequence.test.mjs'
      - 'test/scene-learning-flow.test.mjs'
      - 'test/scene-learning-pacing.test.mjs'
      - 'test/dm-failure-forward.test.mjs'
      - 'test/npc-testimony-reference.test.mjs'
      - 'test/npc-dialogue-comparison.test.mjs'
      - 'test/fixtures/dm-beat-flow-synthetic-v1.json'
      - '.github/workflows/study-p0-tests.yml'
  push:
    branches:
      - 'design/dm-learning-architecture-v1'
    paths:
      - 'public/study-core.mjs'
      - 'scripts/audit-legacy-save.mjs'
      - 'test/study-core.test.mjs'
      - 'test/audit-legacy-save.test.mjs'
      - 'test/world01-structure.test.mjs'
      - 'scripts/validate-story-bundle.mjs'
      - 'test/validate-story-bundle.test.mjs'
      - 'content/contracts/world01-opening-skeleton.json'
      - 'scripts/validate-world01-route-agency.mjs'
      - 'scripts/check-world01-public-contract.mjs'
      - 'test/world01-route-agency.test.mjs'
      - 'test/world01-public-contract.test.mjs'
      - 'test/world01-causal-authoring.test.mjs'
      - 'test/fixtures/world01-causal-authoring-v1.json'
      - 'content/contracts/world01-route-agency-v1.md'
      - 'scripts/validate-dm-beat-flow.mjs'
      - 'scripts/validate-scene-learning-flow.mjs'
      - 'scripts/validate-scene-learning-pacing.mjs'
      - 'scripts/validate-dm-failure-forward.mjs'
      - 'scripts/npc-testimony-reference.mjs'
      - 'scripts/npc-dialogue-comparison.mjs'
      - 'test/dm-beat-flow.test.mjs'
      - 'test/dm-beat-sequence.test.mjs'
      - 'test/scene-learning-flow.test.mjs'
      - 'test/scene-learning-pacing.test.mjs'
      - 'test/dm-failure-forward.test.mjs'
      - 'test/npc-testimony-reference.test.mjs'
      - 'test/npc-dialogue-comparison.test.mjs'
      - 'test/fixtures/dm-beat-flow-synthetic-v1.json'
      - '.github/workflows/study-p0-tests.yml'
permissions:
  contents: read
jobs:
  p0-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated backup and learning event core
        run: node --test test/study-core.test.mjs test/audit-legacy-save.test.mjs test/world01-structure.test.mjs test/validate-story-bundle.test.mjs
      - name: Test first-world public authoring contracts (synthetic only)
        run: node --test test/world01-causal-authoring.test.mjs test/world01-route-agency.test.mjs test/world01-public-contract.test.mjs
      - name: Test spoiler-free DM pacing, failure-forward, and NPC testimony references
        run: node --test test/dm-beat-flow.test.mjs test/dm-beat-sequence.test.mjs test/scene-learning-flow.test.mjs test/scene-learning-pacing.test.mjs test/dm-failure-forward.test.mjs test/npc-testimony-reference.test.mjs test/npc-dialogue-comparison.test.mjs
