name: Study RPG P0 checks
on:
  pull_request:
    paths:
      - 'public/study-core.mjs'
      - 'scripts/audit-legacy-save.mjs'
      - 'test/study-core.test.mjs'
      - 'test/audit-legacy-save.test.mjs'
      - '.github/workflows/study-p0-tests.yml'
  push:
    branches:
      - 'design/dm-learning-architecture-v1'
    paths:
      - 'public/study-core.mjs'
      - 'scripts/audit-legacy-save.mjs'
      - 'test/study-core.test.mjs'
      - 'test/audit-legacy-save.test.mjs'
      - '.github/workflows/study-p0-tests.yml'
permissions:
  contents: read
jobs:
  p0-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated backup and learning event core
        run: node --test test/study-core.test.mjs test/audit-legacy-save.test.mjs
