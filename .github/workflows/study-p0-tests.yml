name: Study RPG P0 checks
on:
  pull_request:
    paths:
      - 'public/study-core.mjs'
      - 'scripts/**'
      - 'test/**'
      - 'content/contracts/**'
      - '.github/workflows/study-p0-tests.yml'
  push:
    branches:
      - 'design/dm-learning-architecture-v1'
    paths:
      - 'public/study-core.mjs'
      - 'scripts/**'
      - 'test/**'
      - 'content/contracts/**'
      - '.github/workflows/study-p0-tests.yml'
permissions:
  contents: read
jobs:
  p0-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated backup and learning event core
        run: node --test test/study-core.test.mjs test/audit-legacy-save.test.mjs test/world01-structure.test.mjs test/validate-story-bundle.test.mjs
      - name: Test first-world public authoring contracts (synthetic only)
        run: node --test test/world01-causal-authoring.test.mjs test/world01-route-agency.test.mjs test/world01-public-contract.test.mjs
      - name: Test spoiler-free DM pacing, failure-forward, and NPC testimony references
        run: node --test test/dm-beat-flow.test.mjs test/dm-beat-sequence.test.mjs test/scene-learning-flow.test.mjs test/scene-learning-pacing.test.mjs test/dm-failure-forward.test.mjs test/npc-testimony-reference.test.mjs test/npc-dialogue-comparison.test.mjs
      - name: Test synthetic NPC state integrity, testimony provenance, and public-copy gates
        run: node --test test/npc-corrupt-state-fail-closed.test.mjs test/npc-knowledge-ledger-integrity.test.mjs test/npc-knowledge-copy-gates.test.mjs test/npc-route-ledger-provenance.test.mjs test/npc-route-state-integrity.test.mjs test/npc-player-knowledge-provenance.test.mjs test/npc-event-id-safety.test.mjs test/npc-invisible-copy-safety.test.mjs test/npc-public-copy-safety.test.mjs test/npc-public-copy-integration.test.mjs test/npc-director-delimiter.test.mjs test/npc-policy-portability.test.mjs test/npc-dialogue-comparison-bridge.test.mjs
      - name: Test synthetic DM event guards, lesson payoff, and route/NPC contract bridges
        run: node --test test/dm-event-guards.test.mjs test/dm-event-guard-array-bounds.test.mjs test/dm-event-guard-bridge.test.mjs test/dm-event-guard-preflight.integration.test.mjs test/dm-knowledge-alignment.test.mjs test/dm-learning-payoff.test.mjs test/dm-npc-route-bridge.test.mjs test/dm-contract-bridge.test.mjs
      - name: Test synthetic player-visible projection, review boundaries, and deferred consequences
        run: node --test test/dungeon-client-projection.test.mjs test/dungeon-public-copy.test.mjs test/dungeon-public-field-review.test.mjs test/dungeon-public-field-review-wire.test.mjs test/dungeon-review-wire-parity.test.mjs test/dungeon-grant-events.test.mjs test/dungeon-skill-actions.test.mjs test/dungeon-advantage-evidence.test.mjs test/route-consequence-outline.test.mjs test/route-response-differentiation.test.mjs test/route-response-invisible.test.mjs test/cross-chapter-consequence.test.mjs test/deferred-callback-trace-reference.test.mjs test/deferred-callback-once.test.mjs test/deferred-callback-multiple-offers.test.mjs test/deferred-callback-offer-identity.test.mjs test/deferred-callback-delivery-ack.test.mjs
