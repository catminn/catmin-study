name: DM multi-turn experience QA
on:
  pull_request:
    paths:
      - 'test/lib/dm-experience-qa.mjs'
      - 'test/dm-experience.test.mjs'
      - 'test/fixtures/dm-experience-cases-v1.json'
      - '.github/workflows/dm-experience-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/dm-experience.test.mjs
