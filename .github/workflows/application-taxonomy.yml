name: Application taxonomy contract
on:
  pull_request:
    paths:
      - 'content/contracts/application-taxonomy-v1.json'
      - 'test/application-taxonomy.test.mjs'
      - '.github/workflows/application-taxonomy.yml'
permissions:
  contents: read
jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/application-taxonomy.test.mjs
