name: Course-agnostic learning adapter
on:
  pull_request:
    paths:
      - 'src/learning-adapter.ts'
      - 'test/learning-adapter.test.mjs'
      - '.github/workflows/course-adapter.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test test/learning-adapter.test.mjs
