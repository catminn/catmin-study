name: DM scene narration checks
on:
  pull_request:
    paths:
      - 'src/turn.ts'
      - 'test/dm-scene-narration.test.mjs'
      - '.github/workflows/dm-scene-narration.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
