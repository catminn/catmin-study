name: World Bible reference contract
on:
  pull_request:
    paths:
      - 'content/contracts/world-bible-ref-contract-v1.json'
      - 'test/lib/world-bible-ref-validator.mjs'
      - 'test/world-bible-ref.test.mjs'
      - '.github/workflows/world-bible-refs.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/world-bible-ref.test.mjs
