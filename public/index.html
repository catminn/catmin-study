<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>主神空间</title>

<style>
/* Layout: game HUD on top, one full-height "screen" per tab (map / calendar / dungeon / shop / bag), fixed bottom tab bar like a mobile game. */
:root{
  --bg:#e7eaf4; --ground:#d9deee; --panel:#ffffff; --panel2:#f1f3fa; --line:#c3cae0; --line2:#a9b2d0;
  --fg:#1b1f3b; --dim:#565d82; --accent:#c4861a; --accent-hi:#e8a93a; --accent-ink:#2e1f02; --accent-soft:#fbecd0;
  --early:#0f8a6e; --early-soft:#d4f1e9; --late:#c93a3a; --late-soft:#f8dddd; --warn:#b96b0c;
  --path:#aab3d3; --shadow:rgba(27,31,59,.14); --scrim:rgba(20,22,40,.45);
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131e; --ground:#161928; --panel:#1d2032; --panel2:#252940; --line:#353a58; --line2:#4a5076;
  --fg:#eeedf6; --dim:#a9a8c4; --accent:#f0c060; --accent-hi:#ffd27a; --accent-ink:#2a1d04; --accent-soft:#3a3122;
  --early:#5fd3b8; --early-soft:#173a35; --late:#f07a7a; --late-soft:#3e2125; --warn:#f2ab58;
  --path:#3d4468; --shadow:rgba(0,0,0,.45); --scrim:rgba(4,5,12,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131e; --ground:#161928; --panel:#1d2032; --panel2:#252940; --line:#353a58; --line2:#4a5076;
  --fg:#eeedf6; --dim:#a9a8c4; --accent:#f0c060; --accent-hi:#ffd27a; --accent-ink:#2a1d04; --accent-soft:#3a3122;
  --early:#5fd3b8; --early-soft:#173a35; --late:#f07a7a; --late-soft:#3e2125; --warn:#f2ab58;
  --path:#3d4468; --shadow:rgba(0,0,0,.45); --scrim:rgba(4,5,12,.65); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.small{font-size:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1.2}
h3{font-size:17px;font-weight:700;line-height:1.35}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:500}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line2);background:var(--panel);border-radius:12px;padding:7px 16px;font-weight:700;box-shadow:0 3px 0 var(--line2);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in oklab,var(--accent) 60%,black)}
.btn.ok{background:var(--early);border-color:var(--early);color:#fff;box-shadow:0 3px 0 color-mix(in oklab,var(--early) 60%,black)}
.btn.sm{padding:4px 12px;font-size:14px;border-radius:10px}
.btn.flat{box-shadow:none;border-color:var(--line);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--panel);border-bottom:2px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.hud .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.lv .badge{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:22px;line-height:1;flex:none;box-shadow:0 3px 0 color-mix(in oklab,var(--accent) 60%,black);text-align:center}
.lv .badge small{display:block;font-size:10px;font-family:var(--body);font-weight:700;letter-spacing:.05em}
.lv .who{min-width:0;flex:1}
.lv .who b{font-size:15px}
.xpbar{height:9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
.res{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-family:var(--mono);font-weight:700;font-size:15px}
button.pill{cursor:pointer}
.pill.gold{color:var(--accent)} .pill.fire{color:var(--late)}
.themebtn{border:2px solid var(--line);background:var(--panel2);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--panel);border-top:2px solid var(--line);padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--dim);font-size:12px;font-weight:700;padding:4px 0;border-radius:12px}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.screen{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--line)}
.cloudbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;border:2px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:14px}.cloudbar.warn{border-color:var(--warn);background:var(--accent-soft)}.cloudbar.err{border-color:var(--late);background:var(--late-soft)}
.banner{border:2px dashed var(--line2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--dim)}

.worldtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wt{border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 10px;text-align:left;box-shadow:0 3px 0 var(--line);min-width:0}
.wt b{display:block;font-size:16px}
.wt span.w{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt[aria-pressed="true"]{border-color:var(--tint);box-shadow:0 3px 0 var(--tint)}
.wt .dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--late);color:#fff;font-size:12px;text-align:center;line-height:20px;padding:0 5px;margin-left:4px;font-family:var(--mono);vertical-align:2px}
@media (max-width:520px){.worldtabs{grid-template-columns:repeat(2,1fr)}}

.maphead{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.maphead .wname{font-family:var(--display);font-size:32px;line-height:1.1;color:var(--tint)}
.map{position:relative;border-radius:20px;border:2px solid var(--line);overflow:hidden;background:
  radial-gradient(circle at 20% 10%,color-mix(in oklab,var(--tint) 22%,transparent),transparent 45%),
  radial-gradient(circle at 85% 60%,color-mix(in oklab,var(--tint) 16%,transparent),transparent 50%),
  var(--ground)}
.map svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;width:150px;color:var(--fg)}
.node .disc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:4px solid var(--path);box-shadow:0 5px 0 var(--path);color:var(--dim);transition:transform .15s}
.node:hover .disc{transform:scale(1.06)}
.node .disc svg{width:30px;height:30px}
.node .cap{font-size:13px;font-weight:700;line-height:1.3;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:2px 8px;max-width:150px;color:var(--fg)}
.node .sub{font-size:11px;color:var(--dim);font-weight:500;display:block}
.node.done .disc{background:var(--tint);border-color:var(--tint);color:#fff;box-shadow:0 5px 0 color-mix(in oklab,var(--tint) 60%,black)}
.node.cur .disc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in oklab,var(--accent) 60%,black)}
.node.locked .disc{opacity:.8}
.node.boss .disc{width:84px;height:84px;border-radius:22px;transform:rotate(45deg);background:var(--late-soft);border-color:var(--late);box-shadow:0 6px 0 color-mix(in oklab,var(--late) 60%,black);color:var(--late)}
.node.boss:hover .disc{transform:rotate(45deg) scale(1.06)}
.node.boss .disc svg{transform:rotate(-45deg);width:38px;height:38px}
.node.boss.done .disc{background:var(--late);color:#fff}
.node.boss .cap{margin-top:12px}
.node.side{width:124px}
.node.side .disc{width:50px;height:50px;border-width:3px;box-shadow:0 4px 0 var(--path)}
.node.side .disc svg{width:22px;height:22px}
.node.side.early .disc{border-color:var(--early);color:var(--early);box-shadow:0 4px 0 var(--early)}
.node.side.ontime .disc{border-color:var(--accent);color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.node.side.late .disc{border-color:var(--late);color:var(--late);box-shadow:0 4px 0 var(--late)}
.node.side.done .disc{background:var(--early);border-color:var(--early);color:#fff}
.node.debt .cap{border-color:var(--late)}
.node .debtflag{font-size:11px;font-weight:700;color:#fff;background:var(--late);border-radius:999px;padding:0 7px}
.node.monster .disc{background:var(--late);border-color:var(--late);color:#fff;box-shadow:0 4px 0 color-mix(in oklab,var(--late) 60%,black)}
.node .rw{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 8px}
.you{position:absolute;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;pointer-events:none;white-space:nowrap;z-index:2}
.you::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--fg);border-bottom:0}
@media (prefers-reduced-motion:no-preference){
  .node.cur .disc{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 5px 0 color-mix(in oklab,var(--accent) 60%,black),0 0 0 10px color-mix(in oklab,var(--accent) 25%,transparent)}}
  .you{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{margin-top:-5px}}
}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;border:2px solid var(--line);border-bottom:0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;border-bottom:2px solid var(--line);padding-bottom:24px}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 0;flex:none}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel2);border:2px solid var(--line)}
.kind.main{color:var(--tint);border-color:var(--tint)}.kind.side{color:var(--early);border-color:var(--early)}.kind.boss{color:var(--late);border-color:var(--late)}
.reward{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.reward .big{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--fg);line-height:1.1}
.reward .calc{font-family:var(--mono);font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px;text-align:center;margin-top:4px}
.ladder div{border-radius:8px;padding:3px 0;background:var(--panel);color:var(--dim);border:2px solid transparent;font-family:var(--mono)}
.ladder div.on{border-color:var(--accent);color:var(--fg);font-weight:700}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px}
.checklist button.done{border-color:var(--early);color:var(--early)}
.checklist button .rw{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--warn);white-space:nowrap}
input[type=text],input[type=number],input[type=datetime-local],textarea.plain,select{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}

.calhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 14px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weekscroll{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--panel)}
.week{display:grid;grid-template-columns:46px repeat(7,minmax(104px,1fr));min-width:780px}
.week .dh{background:var(--panel);border-bottom:2px solid var(--line);padding:6px 4px;text-align:center;font-size:13px}
.week .dh b{display:block;font-size:20px;font-family:var(--mono);line-height:1.2}
.week .dh.today b{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:34px;height:34px;line-height:34px;margin:0 auto}
.week .dh .ck{font-size:11px;font-weight:700}
.week .ck.on{color:var(--early)}.week .ck.miss{color:var(--late)}
.week .due{border-bottom:2px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:34px;min-width:0}
.week .gutter{border-right:1px solid var(--line)}
.week .hr{height:44px;font-size:11px;color:var(--dim);text-align:right;padding-right:6px}
.week .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 44px)}
.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 5px;font-size:12px;line-height:1.3;overflow:hidden;border:0;border-left:4px solid;text-align:left;color:var(--fg)}
.ev.class{background:color-mix(in oklab,#5b7be0 20%,var(--panel));border-color:#5b7be0}
.ev.personal{background:color-mix(in oklab,#a35bd6 18%,var(--panel));border-color:#a35bd6}
.ev.boss{background:var(--late-soft);border-color:var(--late);font-weight:700;cursor:pointer;z-index:1}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--late);z-index:2}
.chip{display:block;border-radius:7px;padding:1px 6px;font-size:12px;line-height:1.4;border:2px solid;background:var(--panel);text-align:left;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg)}
.chip.early{border-color:var(--early)}.chip.ontime{border-color:var(--accent)}.chip.late{border-color:var(--late);background:var(--late-soft)}
.chip.done{border-color:var(--line);color:var(--dim);text-decoration:line-through}
.chip.boss{background:var(--late);border-color:var(--late);color:#fff;font-weight:700}
.chip.canvas{border-style:dashed;border-color:var(--line2);color:var(--dim)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{text-align:center;font-size:12px;color:var(--dim);font-weight:700}
.mday{min-height:92px;border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;cursor:pointer}
.mday.out{opacity:.45}
.mday .dn{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:14px;font-weight:700}
.mday.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stamp{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px}
.stamp.on{background:var(--accent);color:var(--accent-ink)}
.stamp.rest{background:var(--early);color:#fff}
.stamp.miss{border:2px dashed var(--late)}
@media (max-width:560px){.mday{min-height:64px}.mday .chip{font-size:10px;padding:0 3px}}

.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cgrid .wd{text-align:center;font-size:12px;color:var(--dim)}
.cday{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700;padding:0;line-height:1.1;color:var(--fg)}
.cday small{font-size:10px;font-family:var(--body)}
.cday.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cday.rest{background:var(--early);border-color:var(--early);color:#fff}
.cday.miss{border-style:dashed;border-color:var(--late);color:var(--late);background:var(--late-soft)}
.cday.today{outline:3px solid var(--fg);outline-offset:1px}
.cday.future{opacity:.4}
.cday:disabled{cursor:default}
.cday.blank{visibility:hidden}

.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.quest{border:2px solid var(--tint);border-radius:14px;padding:8px 12px;background:color-mix(in oklab,var(--tint) 10%,var(--panel));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:58vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:min(92%,720px);border-radius:16px;padding:12px 16px;min-width:0;overflow-wrap:anywhere;font-size:16px;line-height:1.8}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:2px solid color-mix(in oklab,var(--accent) 40%,transparent);white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--panel2);border:2px solid var(--line)}
.msg.ai .who{font-size:12px;font-weight:700;color:var(--tint);letter-spacing:.1em;margin-bottom:2px}
.msg.sys{align-self:center;font-size:14px;color:var(--dim);background:none;padding:2px;text-align:center}
.msg p{margin:.5em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}
.msg pre{overflow-x:auto;background:var(--panel);padding:8px;border-radius:8px;white-space:pre}
.msg ul,.msg ol{padding-left:1.3em;margin:.4em 0}

/* fullscreen fx */

.fx-banner .sub{font-family:"Noto Serif SC",serif;font-size:clamp(16px,2.6vw,22px);opacity:.9;margin-top:8px}
.fx-veil{position:fixed;inset:0}
.shake{animation:scr .45s}
@media (prefers-reduced-motion:no-preference){
  @keyframes scr{15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
  .fx-banner{animation:bn 1.9s ease-out forwards}@keyframes bn{0%{transform:scale(1.6);opacity:0;filter:blur(8px)}15%{transform:scale(1);opacity:1;filter:none}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
  .fx-veil{animation:veil 1.9s ease-out forwards}@keyframes veil{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
  .foe.hit .fdisc,.me.hurt .ava{animation:shake .5s}@keyframes shake{20%{transform:translateX(-7px) rotate(-8deg)}40%{transform:translateX(7px) rotate(8deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
}

  s:"琉璃城白天亮得刺眼，你走在街上，脚下是玻璃，头顶是玻璃，连邻居的晚饭都看得一清二楚。城心的大透镜裂了，一道细缝从边缘爬进中央，像一根头发。首席玻璃师绛听不见，说话靠手指敲台面，学徒阿砂在旁边翻译，说师傅要重铸透镜。税务官权翻开账本，说料只剩最后一炉，不多不少。你问够不够，他合上账本，说够不够，要看你怎么分。夜里城边开始结霜。你路过工坊，看见绛对着窗玻璃写了四个字，擦掉，又写：别信账本。"},
 {t:"称重",k:"透镜厚薄不均，密度也不均，要把整块玻璃的质量一点点累加起来。原设计对应：二重积分。",
  s:"想知道旧透镜能回收多少料，得先称它。可它太大，称不了，只能切成薄片一片一片估。你和阿砂推着小车在工坊里跑了一天，把每片的厚度和密度记在板上，加起来，权拿笔算了算，说总数不够做出原来那么大的新透镜。他还说，要是透镜做大，老城区今冬就拿不到保暖窗的料。阿砂没说话，他的奶奶住在老城区。你和绛对坐，她用手在你掌心敲了三下：全给透镜。第二天权贴出告示，老城区的窗户这个冬天不换了。三周后寒潮来的夜里，老城区冻坏了很多人，阿砂的奶奶没有熬过去。他在工坊门口坐了一整夜。",
  sb:"想知道旧透镜能回收多少料，得先称它。可它太大，称不了，只能切成薄片一片一片估。你和阿砂推着小车在工坊里跑了一天，把每片的厚度和密度记在板上，加起来，权拿笔算了算，说总数不够做出原来那么大的新透镜。他还说，要是透镜做大，老城区今冬就拿不到保暖窗的料。阿砂没说话，他的奶奶住在老城区。你把数字重新排了一遍，问绛：透镜小一圈，聚光会弱多少？她用手比划，只弱一点，够一个冬天。你们把料一分为二。老城区装窗的那天，阿砂的奶奶隔着新玻璃朝他招手，什么也没说，眼睛是亮的。"},
 {t:"冬至",k:"要把一个立体的东西整体累加起来，例如总质量或总体积，需要对立体区域积分。原设计对应：三重积分。",
  s:"冬至前夜，新透镜架上了塔。绛站在塔顶，把手按在玻璃上，一动不动。阿砂在下面喊，师傅说她感觉得到，它不像上一块那样会唱。你才知道，二十年前那次事故，裂缝是绛自己造成的，那一炉她失了手，也是那天她再也听不见了。她一直想用第二块透镜把第一块忘掉。太阳从东边的山后升起，光穿过新玻璃，在塔下的广场落成一枚白色的圆。权站在最后一排，没有走进去。他的账本上，撤离名单的最后一行，写的是他自己的名字。老城区没有窗的街区里，有人在哭。",
  sb:"冬至前夜，新透镜架上了塔。绛站在塔顶，把手按在玻璃上，一动不动。阿砂在下面喊，师傅说她感觉得到，它比上一块小，但会唱。你才知道，二十年前那次事故，裂缝是绛自己造成的，那一炉她失了手，也是那天她再也听不见了。她一直想用第二块透镜把第一块忘掉。太阳从东边的山后升起，光穿过新玻璃，在塔下的广场落成一枚白色的圆。权站在最后一排，没有走进去。他的账本上，撤离名单的最后一行，写的是他自己的名字。绛对你比了一个手势，阿砂翻译，师傅说：春分以前，我还要再铸一次。"}
 ]},
{id:"whale",name:"鲸腹空心星",tint:"#8b5cf6",st:3,desc:"你脚下是别人的天花板。这颗空心的星，正在一次比一次剧烈地摇晃。",
 pre:"鲸腹是一颗空心的星，城市建在球壳内壁上，中央悬着一颗小太阳。星球最近开始摇晃，水倒向一侧，货仓一个个塌下来，必须找到质心并重新配平。真相：维修队长渊在底舱私藏了三十一位买不起船票的冷冻乘客，这批重货让质心偏了位置。",
 cast:[["渊","维修队长，豪爽，欠了一屁股债","私货舱里是三十一位冷冻乘客，他收了他们的钱，却买不起合规的舱位",0],["小满","十二岁的信号员，住在内壁最低的街区，话多","她半年前收到过外面传来的求救信号，没敢告诉任何人",0],["司南","导航官，冷静，说话像报坐标","她是上一批玩家，通关以后留在了这里，认识零",1]],
 recap:"稳住了摇晃的鲸腹，朝着远方的求救信号出发。",
 zero:"司南看着零，说了一个你没听清的名字。零问她，那是谁。她说，没谁，认错人了。",
 clear:"鲸腹转向了信号的方向。小满把耳机摘下来，贴在你耳边，说，你听，它在回答了。",
 fork:{ch:1,t:"最底下的货舱",q:"摇晃的根源躺在最底下，处理它有两种办法。",b:"改写后，没有人被抛出去。代价是全城停摆三天，口粮见底。",price:150},
 ch:[
 {t:"内壁上的城",k:"位置要用角度和距离描述，选对坐标系才能把区域上的量累加清楚。原设计对应：极坐标、柱坐标、球坐标下的积分。",
  s:"鲸腹的天空是另一边的地面。你抬头，看见远处的街道倒挂着，像一座城市贴在天上。小满给你当向导，说在这里找路不能用东南西北，要用角度和距离，从中央那颗小太阳量起。她的家在最低的内壁，那里的水总往一边倒。你走到半路，整颗星晃了一下，吊车倒在你身后，砸坏了一条街。维修队长渊赶来，用一串粗话安慰所有人。导航官司南站在高处，目光从人群里穿过，停在你身边那个看不见的光点上。她问，你们还在用这个编号？"},
 {t:"重心",k:"货物分布不均，要用密度对整个区域累加，找到质量的中心。原设计对应：积分的应用，质量与质心。",
  s:"摇晃越来越大。你和小满爬进货舱，把每个舱的位置和重量记下来，一圈圈加，找到那个让整颗星偏航的点：它在最底下，不在任何一张货单上。渊低着头开了门。门后是三十一个冷冻舱，里面睡着的人全是他收了钱、买不起正经船票的乘客。重量全压在一侧。司南站在你身后说，把货舱抛出去，星就稳了。渊没有反驳，他只是把手放在其中一个舱盖上。你按下了抛舱的按钮。星球稳住了，舷窗外面，一排小小的银色光点慢慢落进黑暗，小满捂着嘴，渊一夜白了头。",
  sb:"摇晃越来越大。你和小满爬进货舱，把每个舱的位置和重量记下来，一圈圈加，找到那个让整颗星偏航的点：它在最底下，不在任何一张货单上。渊低着头开了门。门后是三十一个冷冻舱，里面睡着的人全是他收了钱、买不起正经船票的乘客。司南说，把货舱抛出去，星就稳了。你没动。你把数字重新排了一遍，发现不必抛：只要全城一半的人把家具搬到对面半球，质心就能挪回来。广播喊了一夜，口粮仓被搬空了三次，没人睡觉。天亮时星球不晃了。渊站在冷冻舱前，对着三十一个沉睡的人敬了个礼。"},
 {t:"鲸歌",k:"这一章是对前面内容的综合运用：选择合适的坐标，把分布的量累加，并解释结果的意义。原设计对应：重积分的综合应用，或向量场与线积分的入门。",
  s:"星稳下来以后，小满终于说出那个秘密：半年前，她收到过一段来自外面的求救信号，很弱，一直重复，一个词：鲸。她没敢说，怕被当成孩子的幻想。司南把信号放出来，一段很慢的歌，像水里的某种大动物。她说，这是另一颗星，漂在黑暗里，没有太阳。鲸腹的小太阳在渐渐变暗，要靠人在中央维护，那里没有重力，一个人可以悬着守一辈子。渊要去。你站在中央舱门口，听着歌，看他把自己绑在维护架上，笑着说，这活我熟，我欠的债本来就是还不完的。",
  sb:"星稳下来以后，小满终于说出那个秘密：半年前，她收到过一段来自外面的求救信号，很弱，一直重复，一个词：鲸。她没敢说，怕被当成孩子的幻想。司南把信号放出来，一段很慢的歌，像水里的某种大动物。她说，这是另一颗星，漂在黑暗里，没有太阳。鲸腹的小太阳在渐渐变暗，要靠人在中央维护。这次不用渊一个人去。三十一位被唤醒的乘客里有一半是机械师，他们接过扳手，说，船票钱，我们用手艺付。你站在中央舱门口，听着歌，看他们排着队飘进去，渊在最后，笑得很难看。"}
 ]},
{id:"wind",name:"风冢神殿",tint:"#d9772b",st:1,desc:"进了风环的人，没有一个走出来过。神殿说，那是恩赐。",
 pre:"高原上的风有固定的走向，人们沿着风的地图旅行。中央的永动神殿声称风帆绕环一圈就会变得更快，给全城免费供能。真相：风环确实每转一圈多出一份能量，但这份能量来自地下一条正在干涸的古河。同时，校准官迁正在靠近，他要把整个空间的原点挪到自己身上。",
 cast:[["昼","神殿祭司长，温和，说话慢","他知道永动是假的，一直在拖时间，想在古河干涸前找到替代办法",0],["岚","风帆匠，年轻，嘴硬","她的老师是神殿的前任祭司，她想证明神殿是对的",0],["迁","校准官，灰袍，笑起来很有礼貌","他要把整个空间的原点从零身上挪走，换成自己",2]],
 recap:"识破了永动神殿的真相，也拦下了想把原点搬走的校准官迁。",
 zero:"零说，他想起了一个字，岸。他不知道那是名字，还是一个地方。",
 clear:"风重新有了方向。昼把神殿的钥匙交给岚，说，下一座，建在风吹得到的地方。",
 fork:{ch:1,t:"风环中央",q:"神殿将要坍塌，有人会留在风环中央。",b:"改写后，他能走出来。代价是整座神殿的壁画都会毁掉。",price:150},
 ch:[
 {t:"风的地图",k:"风是一张向量场，沿不同路径从同一个起点走到同一个终点，需要的功可能相同，也可能不同。原设计对应：向量场与线积分，保守场。",
  s:"高原上的风有地图，每个路口都挂着一块风向牌。岚带你穿过集市，边走边教你认：顺风省力，逆风费力，从甲地到乙地，你可以绕远路也可以抄近路，她说神奇的是，在大多数地方，花的力气一样。她带你去看一个例外：神殿外面的环形风道。你把一根羽毛丢进去，它转了一圈，回到起点时飞得比出发时更快。岚得意地看你，说，这就是神迹。祭司昼站在台阶上，没有笑，只对你点点头，说，你看得很仔细。"},
 {t:"转一圈",k:"沿一条闭合回路绕一圈，场做的功不为零，说明它不是保守场，并要追问能量从哪里来。原设计对应：保守向量场的判定与势函数。",
  s:"你在神殿里待了三天，把环形风道每一段的风向画成箭头，沿闭合路径一段段累加。结果每一圈都多出一份，恒定不变。你又顺着多出来的那份去找来源，一路找到地下，找到一条几乎干涸的古河。昼在地下河边等你，说，我知道，三年了。岚追过来，红着眼说你们都在撒谎。就在这时，环形风道发出一声长鸣，古河见底，神殿开始塌。昼走进风环中央，说他要把最后一股水引出去。你只能在外面看着，岚被你拉住，手腕上留下一圈红印。",
  sb:"你在神殿里待了三天，把环形风道每一段的风向画成箭头，沿闭合路径一段段累加。结果每一圈都多出一份，恒定不变。你又顺着多出来的那份去找来源，一路找到地下，找到一条几乎干涸的古河。昼在地下河边等你，说，我知道，三年了。岚追过来，红着眼说你们都在撒谎。就在这时，环形风道发出一声长鸣，神殿开始塌。昼走进风环中央。你喊住他，说有一条路线，沿着走的话每一段的功正好抵消，是整座神殿里唯一的安全路径。你们顺着这条线把他带了出来。身后，神殿的壁画一幅一幅落进尘土。"},
 {t:"原点",k:"换一个原点只会改变位置的读数，不会改变两点之间的差。这一章要解释哪些量与原点无关。原设计对应：势函数，以及沿路径的功只取决于起点与终点之差，或格林定理一类的后续内容。",
  s:"神殿塌了以后，高原上起了第一阵没有方向的风。迁就是这时候来的。他穿着很干净的灰袍，对你行礼，说要为这个世界做一次校准。他的目光越过你，看着零所在的位置，说，原点偏了太久，该换一个了。你才明白，所有世界的位置都是从零身上量出来的，他想把原点挪到自己身上，所有地图都会跟着改写。你对他说，搬家不会改变距离。两点之间的差，不管原点放在哪里，都一样。迁笑着看你很久，说，你比上一个想得清楚。灰袍一点点退成风，零安静地站在你身边，轻声说了一个字：岸。",
  sb:"神殿塌了以后，高原上起了第一阵没有方向的风。昼拄着拐杖站在废墟上，岚扶着他。迁就是这时候来的。他穿着很干净的灰袍，对你们行礼，说要为这个世界做一次校准。他的目光越过你，看着零所在的位置，说，原点偏了太久，该换一个了。你才明白，所有世界的位置都是从零身上量出来的，他想把原点挪到自己身上，所有地图都会跟着改写。你对他说，搬家不会改变距离。两点之间的差，不管原点放在哪里，都一样。昼在你身后慢慢说，我活得比你们久，原点从来不重要，路才重要。迁笑着看你很久，说，你比上一个想得清楚。灰袍一点点退成风，零安静地站在你身边，轻声说了一个字：岸。"}
 ]}
],
chem:[
{id:"cloud",name:"坠云群岛",tint:"#4cb06b",st:5,desc:"整座岛每天下沉三厘米，没人知道气是从哪里漏掉的。",
 pre:"群岛靠气囊悬在云上，每座岛底下挂着几十格气室。有的岛在缓慢下沉，没人知道气是怎么漏的。真相：商会长范为了省成本，三年来把易燃的氢气掺进氦气室，比例失衡，岛才会沉，而且任何一点火星都可能引燃。",
 cast:[["莫雨","气象官，爱记数据，说话直","她早就测出气室成分不对，上报没人理，一直偷偷写笔记",0],["阿翎","补气囊的少年，胆大，爱爬绳","他爸爸是范的手下，他以为自己在做好事",0],["范","商会长，爱笑，请所有人吃饭","氢气是他掺的，已经掺了三年",1]],
 recap:"识破气室里的氢气，云脚群岛完成了大起飞。",
 zero:"零说，他对风的味道有印象。他说他曾经在一个很高的地方站了很久，等一个人下来。",
 clear:"群岛升到云上，太阳照在每一只气囊的背面。阿翎在绳网上张开手臂，喊，我们飞起来了。",
 fork:{ch:1,t:"十四号气室",q:"掺假的真相摆在桌上，有两种收场。",b:"改写后，范私下赎罪，所有气室当晚换完。代价是真相被压下，莫雨的笔记会被烧掉。",price:150},
 ch:[
 {t:"会漏气的岛",k:"岛下沉说明气室里气体的量或温度变了，要用压强、体积、温度和物质的量之间的关系估算还剩多少气。原设计对应：理想气体定律与气体定律。",
  s:"云脚群岛的集市挂在一只巨大的气囊下面，卖面的摊子在风里轻轻摇。你到的第一天，莫雨拿着气压表敲你的肩，说这座岛每天下沉三厘米。她给你看笔记，一页页都是数字：压强、体积、温度，一天一行。你帮她算出气室里的气每天少掉的量，数字很规整，规整得不像自然漏气。阿翎从绳网上荡下来，满手机油，说他每天都补，补不完，补完第二天还漏。他说得很自豪，像一个以为自己在拯救世界的人。"},
 {t:"掺了东西的气室",k:"气室里是混合气体，每种气体各自贡献一部分压强，要判断各占多少。原设计对应：分压与气体混合，也可以用气体分子的速率与扩散估算通风时间。",
  s:"莫雨查到第十四号气室的读数不对，压强对得上，可重量不对，你们用分压把混合比拆开，发现里面有三成是氢。三成。她的手抖了一下，说这是范会长的商会供的气。雷云正从西边压过来，育幼岛的气室就在这一排。范笑着赶到现场，说他可以解释，今晚设宴，大家慢慢谈。莫雨把笔记摔在桌上，当着满桌人念完所有数字。商会的人一个接一个站起来，范一直在笑，笑到最后只剩嘴角。那一夜莫雨带人把十四号气室一格格放空，雷落在远处的海上。第二天商会垮了，三个月没有补给船来。",
  sb:"莫雨查到第十四号气室的读数不对，压强对得上，可重量不对，你们用分压把混合比拆开，发现里面有三成是氢。三成。她的手抖了一下，说这是范会长的商会供的气。雷云正从西边压过来，育幼岛的气室就在这一排。范笑着赶到现场，说他可以解释，今晚设宴，大家慢慢谈。席间他低声开了价：他有一批私藏的纯氦，可以把所有气室换完，条件是这件事到此为止。你看着莫雨。她把笔记本推到范面前，说，你烧了它。范把笔记烧在烛火里。当晚所有气室换完，雷落在远处的海上。"},
 {t:"最后一次起飞",k:"这一章把前面学过的内容综合起来，用于判断一次真实操作是否安全，例如换气的先后顺序、气体混合后的压强与温度变化。原设计对应：气体动理论与热化学入门。",
  s:"气室稳住以后，群岛迎来一年一度的大起飞：所有岛一起升到云层之上，去追太阳。阿翎负责最后一道检查，他爬进十四号气室，把残余的气一点点排空，换上干净的气。你在底下举着灯给他照路，听见他在里面唱歌，调子很乱。他出来的时候满脸都是汗，笑着说，我爸做的事，我来补。群岛缓缓升起，云被甩在身后，天一下子空了。莫雨站在你旁边，说，我写了三年的数字，第一次想把它们念给别人听。",
  sb:"气室稳住以后，群岛迎来一年一度的大起飞：所有岛一起升到云层之上，去追太阳。阿翎负责最后一道检查，他爬进十四号气室，把残余的气一点点排空，换上干净的气。你在底下举着灯给他照路，听见他在里面唱歌，调子很乱。他出来的时候满脸都是汗，笑着说，我爸做的事，我来补。群岛缓缓升起，云被甩在身后，天一下子空了。莫雨摸着空荡荡的口袋，笔记本已经烧了。她说，没关系，数字都在这里，指了指自己的脑袋，眼睛有点红。"}
 ]},
{id:"forge",name:"余烬之城",tint:"#d1493f",st:4,desc:"火山口里的城，每天凭空少掉一截热。有人在偷火。",
 pre:"熔炉城建在火山口里，靠地热和炉火运转，记账官把全城的热量一笔一笔记在账上。最近账对不上了，每天有一部分热量凭空消失，大炉越来越冷。真相：热量被下层隧道的流民偷偷引走了，他们不这样做冬天会冻死；炉长烬三年前曾为了救学徒让大炉熄过一夜，并伪造了日志。",
 cast:[["烬","炉长，手上满是烫疤，话少","她曾为了救三个学徒让大炉熄过一夜，并伪造了日志",0],["小盐","记账官，二十出头，神经质，必须平账","她把对不上的数字悄悄抹平，不想让全城恐慌",0],["影炭","戴面具的窃热者","他们是住在下层隧道的流民，用管子从主炉偷热，只为过冬",1]],
 recap:"理清了熔炉城的热账，大炉在冬天里重新点燃。",
 zero:"零闻到了炭火的味道，说，这个味道他知道。有人曾经递给他一个暖手的东西，很烫，他捧了很久。",
 clear:"熔炉城的冬天来了，大炉的火一整夜没有熄。下层隧道里，有人第一次脱下了毯子。",
 fork:{ch:1,t:"下层隧道",q:"偷热的人被找到了，该怎么处置。",b:"改写后，下层隧道也有了暖气。代价是炉长要违规改管路，可能因此丢掉职位。",price:150},
 ch:[
 {t:"对不上的账",k:"总热量守恒，但中间过程未知时，可以用已知步骤的热量加减得到未知过程的热量。原设计对应：热化学与盖斯定律。",
  s:"熔炉城的墙是热的，你走在街上，鞋底像踩着一块刚出炉的面包。记账官小盐把你带到账房，墙上贴满了写着热量的纸，每一张都被她画满了红圈。她说大炉要烧哪一步，产多少热，应该吻合，可这三个月以来总是差一块，每天差得一模一样。你发现其中一步没有人测过，但可以用别的几步加减推出来，一算，缺的正好是这一块。小盐捂住了嘴。烬站在门口，什么也没说，只把工作手套往桌上一扔。"},
 {t:"谁在偷热",k:"化学键的断裂吸热、形成放热，也可以用量热器测出一个过程放出或吸收的热量，用来追踪热量去了哪里。原设计对应：键能与量热。",
  s:"你和小盐顺着管道一路往下爬，用量热计一处一处测，终于在最深的隧道里找到那根偷来的管子。管子通向一间低矮的石室，里面挤着几十个人，披着毯子，围着一盆刚能取暖的炭。戴面具的影炭拦住你们，摘下面具，是个很年轻的姑娘。她说，冬天快到了，上面不给下面热。烬追下来，看了一圈，对你说，这是违法的。矿政官一个小时后就到。你们最终没拦住矿政官，隧道被封死，管子被拆了，石室里的人一夜之间被赶去了更冷的地方。",
  sb:"你和小盐顺着管道一路往下爬，用量热计一处一处测，终于在最深的隧道里找到那根偷来的管子。管子通向一间低矮的石室，里面挤着几十个人，披着毯子，围着一盆刚能取暖的炭。戴面具的影炭拦住你们，摘下面具，是个很年轻的姑娘。她说，冬天快到了，上面不给下面热。烬追下来，看了一圈，对你说，这是违法的。你把数字摊在桌上：大炉有多余的废热，每天白白散掉，只要改一条管路，就能分给下层，又不影响主炉。烬沉默了很久，说，改管路要违规。她把工作牌摘下来，放在桌上，说，我来改。"},
 {t:"熄火的那一夜",k:"炉子里的反应是可逆的，条件一变，平衡就会移动，要判断移向哪边、产物多了还是少了。原设计对应：化学平衡与勒夏特列原理。",
  s:"大炉要在冬至前重新校准，所有人都聚在炉前。小盐终于把藏了很久的真相说出来：她把对不上的数字悄悄抹平过，就是怕大家恐慌。烬接着说，三年前有一夜，她让大炉熄过火，为了救困在管里的三个学徒，日志是她改的。炉前静了很久。没有人动。最后是一个很老的铸工说，把炉重新点起来吧。火舌重新舔上炉壁，亮得像一个新生的太阳。烬站在火光里，手套里的手在抖。影炭的石室在更冷的地方，没有人去送炭。",
  sb:"大炉要在冬至前重新校准，所有人都聚在炉前。小盐终于把藏了很久的真相说出来：她把对不上的数字悄悄抹平过，就是怕大家恐慌。烬接着说，三年前有一夜，她让大炉熄过火，为了救困在管里的三个学徒，日志是她改的，还有刚刚违规改了管路。炉前静了很久。没有人动。最后是一个很老的铸工说，把炉重新点起来吧，也给下面留一根管子。火舌重新舔上炉壁，亮得像一个新生的太阳。影炭站在人群最后，把面具放在了炉台上。"}
 ]},
{id:"spring",name:"蚀泉镇",tint:"#c9a227",st:2,desc:"泉水一天比一天酸，所有人都说，是有人下了毒。",
 pre:"山镇的泉水越来越酸，牲畜生病，药铺门口排起了长队。药师白芷用配好的缓冲药剂稳住病人。镇上怀疑是上游的老矿渗出了东西。真相：没有人投毒，是白芷为了溶掉堵塞水管的水垢，偷偷往泉里加弱酸，泉水的缓冲能力被耗尽之后，酸度突然崩了。",
 cast:[["白芷","药师，温柔，手总是干净","是她偷偷往泉里加了弱酸，原本只是想清水管",0],["赫","老矿主，脾气暴，被所有人怀疑","他知道矿渣会渗水，一直在偷偷修，从没解释",0],["阿柚","药铺的小学徒，八岁，拿着大号量杯","她看见过白芷夜里往泉里倒东西",1]],
 recap:"查明苦泉变酸的真相，全镇搬到了新泉边。",
 zero:"零说他有一种很奇怪的感觉：好像他自己也曾被什么一点一点磨掉过，没有人发现，直到有一天突然崩了。",
 clear:"苦泉镇搬进了新家，新泉的水很甜。白芷在药铺门口挂了块牌子，上面只写一个字：问。",
 fork:{ch:1,t:"最后的药剂",q:"缓冲药剂只剩最后一批，泉水和病人只能顾一头。",b:"改写后，泉水和病人都能稳住。代价是泉水只能撑三个月，全镇要尽快搬走。",price:150},
 ch:[
 {t:"变酸的水",k:"酸的强弱决定溶液的酸度，要根据酸的浓度和电离程度算出溶液的pH。原设计对应：弱酸弱碱的pH。",
  s:"苦泉镇的泉水从石缝里涌出来，你尝了一口，舌头发麻。药师白芷把你拉到药铺后院，指着一排试管，说镇里人都怀疑是上游的矿，可她不信，想先把数字量清楚。你们取了泉水，稀释，测酸度，再对照她记了多年的老数据，泉水比去年酸了几十倍。白芷的手很稳，每一步都做得干净。门口排着队，赫老矿主在人群外面站着，帽檐压得很低，被所有人指着骂。你路过他，他说了一句话：不是我。"},
 {t:"缓冲剂",k:"缓冲溶液能抵抗酸碱的加入，但容量有上限，要算缓冲剂能撑多久、加多少才能稳住。原设计对应：缓冲溶液，也可以用沉淀反应检验水里有没有某种离子。",
  s:"病人越来越多，白芷的缓冲药剂快用完了。你帮她算出配比，一份药剂最多能中和多少酸，又能撑几天。同时你拿矿渣的水样做沉淀试验，加试剂，没有出现应有的白色浑浊，说明矿渣里没有那种离子。真凶不在矿里。夜里阿柚拉着你的袖子，说，我看见白芷姐姐往泉里倒东西。白芷在药铺门口站了很久，把最后一瓶缓冲剂递给病得最重的老药农，那是她的老师。泉水没有人再管了，三天后，镇子决定搬。",
  sb:"病人越来越多，白芷的缓冲药剂快用完了。你帮她算出配比，一份药剂最多能中和多少酸，又能撑几天。同时你拿矿渣的水样做沉淀试验，加试剂，没有出现应有的白色浑浊，说明矿渣里没有那种离子。真凶不在矿里。夜里阿柚拉着你的袖子，说，我看见白芷姐姐往泉里倒东西。你没有立刻揭穿，先把剩下的药剂重新算了一遍：稀释到刚好的程度，一半稳住泉水，一半留给病人，泉水能撑三个月，老药农也撑得过来。白芷看着你，眼眶红了，说，谢谢。"},
 {t:"干净的手",k:"要判断混合后会不会出现沉淀，比较离子浓度的乘积与溶解度的限度。原设计对应：溶解度与沉淀。",
  s:"白芷在全镇人面前承认了。她只是想溶掉水管里的水垢，每晚加一点点弱酸，加了两年，缓冲的能力被一点点磨光，今年突然崩了。人群没有骂她，也没有人说话。赫老矿主第一个走出来，说，我把矿口封了，水我来引。白芷把药铺的钥匙交给阿柚，说，等我回来。镇子决定搬到山下的新泉边。搬家那天，阿柚抱着那个大号量杯，走在最前面，一路念着刚学会的配比。",
  sb:"白芷在全镇人面前承认了。她只是想溶掉水管里的水垢，每晚加一点点弱酸，加了两年，缓冲的能力被一点点磨光，今年突然崩了。人群没有骂她，也没有人说话。赫老矿主第一个走出来，说，我把矿口封了，水我来引。白芷的老师躺在担架上，已经能坐起来，他伸手拍了拍她的手背，说，下次先问我。泉水只能撑三个月，镇子要在冬天以前搬到山下的新泉边。搬家那天，阿柚抱着那个大号量杯，走在最前面，一路念着刚学会的配比。"}
 ]},
{id:"tower",name:"终钟之塔",tint:"#d1559a",st:6,desc:"越往上，时间越快。塔顶有人每晚把终钟往回拨一格。",
 pre:"熵塔是一座无限高的钟楼，每上一层，时间流得更快，塔顶有一座终钟，钟停的时候万物冷却、均匀、不再变化。守钟人辰每晚把终钟拨回一格，想把世界停在女儿还在的那个下午。真相：他的拖延让整座塔里的变化越来越慢，热量散不出去，塔下的城市在一点点冻结。",
 cast:[["辰","守钟人，白发，说话轻","他每晚把终钟拨回一格，想留住女儿还在的那个下午",0],["小遥","爬塔的送信人，十五岁，腿脚快","她有一封送了两年的信，收信人一直没人认领，署名是辰的女儿",0]],
 recap:"让熵塔的终钟重新向前走，塔下的城市暖了起来。",
 zero:"零一直没说话。你问他，他说他想起一件事：他曾经把自己所有的记忆都交了出去，才换一个人走出那扇门。他不记得那个人是谁，只记得她背着书包。",
 clear:"终钟重新走了起来。塔下的城市升起第一缕炊烟，小遥把最后一封信塞进了某个有人在家的信箱。",
 fork:{ch:1,t:"那封信",q:"守钟人面前，放着一封一直没有拆开的信。",b:"改写后，他会把信读完。代价只有积分，这一章会更难受一些。",price:150},
 ch:[
 {t:"向上爬的钟",k:"一个过程是否会自发发生，由体系的混乱程度变化和热量共同决定，要解释为什么变化只朝一个方向进行。原设计对应：熵与自发过程。",
  s:"熵塔的第一层，钟摆很慢，悠悠地晃。到了第十层，钟摆快得只剩一道影子。小遥带你往上爬，一边爬一边把信塞进每一层的信箱，说这座塔里的东西只会往一个方向走：热的变凉，整齐的变乱，没有人见过反过来的。你把一杯热水放在窗台，眼看着它凉下去，没有谁能让它自己重新烧开。守钟人辰站在塔顶的阳台上，手里拿着一把很小的钥匙，对着终钟，一格一格往回拨。他看见你，说，请别告诉别人。"},
 {t:"只能向前的时间",k:"某个过程在什么温度下自发，取决于焓变、熵变和温度，用吉布斯自由能判断方向。原设计对应：自由能。",
  s:"你和小遥花了一天时间在塔里测各层的温度，发现越往上，热越散不出去，塔下的城市比去年冷了好几度。你算出一个数，要使整座塔继续转动，终钟必须往前走，不能再被拨回。辰听完，沉默了很久，说，我知道，可是往前就是明天，我女儿不在的明天。他给你看一张照片，一个扎着羊角辫的小姑娘，坐在这座塔的阳台上。小遥偷偷把信递给他，那是她送了两年、一直没人认领的信，署名正是那个小姑娘。辰没拆，他把信贴在胸口，终钟又被他拨回一格。",
  sb:"你和小遥花了一天时间在塔里测各层的温度，发现越往上，热越散不出去，塔下的城市比去年冷了好几度。你算出一个数，要使整座塔继续转动，终钟必须往前走，不能再被拨回。辰听完，沉默了很久，说，我知道，可是往前就是明天，我女儿不在的明天。他给你看一张照片，一个扎着羊角辫的小姑娘，坐在这座塔的阳台上。小遥把信递给他，那是她送了两年、一直没人认领的信，署名正是那个小姑娘。你对他说，那天下午已经被你留下了，不在钟里，在你看着它的时候。辰把信拆开，读了很久，把钥匙放在窗台上。"},
 {t:"明天",k:"这一章是对前面内容的综合运用：判断一个过程在给定条件下能不能发生，并用数字说明。原设计对应：自由能、熵的综合应用，或下一单元的新内容。",
  s:"最后一夜，你和小遥爬上终钟。辰拦在门前，把钥匙握得很紧。你没有劝，只是把窗台上那杯凉透了的水递给他，说，它凉了，可水汽散进了空气里，被别人呼吸到了。变化没有把什么带走，只是把它分给了更多的地方。辰看着杯子，很久，把钥匙放进你手里。终钟往前走了一格，咔的一声，整座塔轻轻晃了一下，下面的城里，一扇一扇的窗亮了。那封信还贴在他胸口，他始终没有拆。",
  sb:"最后一夜，你和小遥爬上终钟。辰没有拦你，他自己把钥匙放进你手里，说，她在信里写，爸爸，你的钟走得太慢了，我想知道明天是什么样。你把终钟往前拨了一格，咔的一声，整座塔轻轻晃了一下，下面的城里，一扇一扇的窗亮了。你把窗台上那杯凉透了的水递给他，说，它凉了，可水汽散进了空气里，被别人呼吸到了。变化没有把什么带走，只是把它分给了更多的地方。辰笑了，眼泪掉进杯子里。"}

{id:"bridge",name:"未渡之桥",tint:"#5f7fb0",st:0,desc:"桥在晃。镇长说灯节照常，老桥工说，今晚别上桥。",

 cast:[["老沈","桥工，手粗，爱用手掌拍桥墩听声音","他早就写过三次报告，都被压下了",0],["阿钉","学徒，十六岁，爱拿尺子量东西","他第一次要独自签检查单，手一直在抖",0],["桐","镇长，精明，疼镇上人","她比谁都清楚桥有问题，她赌的是桥能再撑一个节日",1]],

 ch:[
 {t:"会晃的桥",k:"把一座结构拆开，画出每一块受到的所有力，判断力和力矩是否平衡，找出哪里少了一份力。原设计对应：静力学与受力图。",
  s:"断桥镇的桥站在河上，像一个佝偻的老人。你踩上去，脚下轻轻一颤。老沈蹲在桥墩边，用手掌拍了拍，侧着耳朵听，说声音不对。他让你和阿钉画一张图，把桥上所有的力都标出来：人、车、风、桥自身的重量，还有桥墩推回来的力。你们画到天黑，箭头密密麻麻，最后发现左桥墩推回来的力，比它应该推的少了一截。阿钉抬头问，那少的那一截去哪了？老沈没答，只低头把一句话咽了回去。"},
 {t:"灯节前夜",k:"材料受力会变形，超过限度会断裂，要判断构件承受的应力是否超过材料的极限。原设计对应：应力、应变与材料强度。",
  s:"灯节前夜，你们量了桥墩的裂缝，又测了桥面在人群走动下的下沉。你把应力算了一遍，数字摆在桌上，已经逼近石料的极限。镇长桐拿着名单走进来，说灯节取消，全镇的收成就没了。老沈说，桥可以再撑一天，可撑不到人群散去。桐沉默了很久，说，那就关桥。她没有哭，只是把灯节的彩带一条条收了起来。对岸有个孩子等着过桥，他的妈妈在医馆，药在桥这边。守桥的人拦住他，药晚到了一天。",
  sb:"灯节前夜，你们量了桥墩的裂缝，又测了桥面在人群走动下的下沉。你把应力算了一遍，数字摆在桌上，已经逼近石料的极限。镇长桐拿着名单走进来，说灯节取消，全镇的收成就没了。老沈说，桥可以再撑一天，可撑不到人群散去。你把数字重新排列：每次放行不超过二十人，间隔一刻钟，桥面的应力始终低于极限。桐看着你，说，这样要放行一整夜。你说，那就放行一整夜。守桥的人把对岸那个等药的孩子放在第一批，他拿着药一路跑回医馆。"},
 {t:"最后一榫",k:"要为修复方案选择材料和尺寸，在强度、重量、成本之间权衡并留出安全系数。原设计对应：工程设计与安全系数。",
  s:"天亮之前，桥修好了，用的是老沈压在箱底三十年的一根松木。灯节取消，彩带没有再挂出来，但药在第二天中午送到了医馆，孩子的妈妈没有大碍。阿钉第一次独自签了检查单，手在抖，签的是自己的名字。老沈拍了拍桥墩，这次声音是对的。桐站在桥头，没有发表任何讲话，只是向老沈鞠了一躬。有人问老沈，你写了三份报告，为什么不闹？他说，我也闹过，我的话分量不够。阿钉在日记里写，下次，我的话要有分量。",
  sb:"天亮之前，桥修好了，用的是老沈压在箱底三十年的一根松木。灯节照常办完，一盏灯也没少。阿钉第一次独自签了检查单，手在抖，签的是自己的名字。老沈拍了拍桥墩，这次声音是对的。桐站在桥头，向老沈鞠了一躬，又转身向全镇的人鞠了一躬，说桥是我压着不让关的。有人问老沈，你写了三份报告，为什么不闹？他说，我也闹过，我的话分量不够。阿钉在日记里写，下次，我的话要有分量。"}
 ]},
{id:"engine",name:"地底心脏",tint:"#a86c3a",st:4,desc:"全城都在欢呼效率百分之百。只有司炉女工知道，煤仓快空了。",

 {t:"百分之百",k:"热机把一部分热变成功，其余必然排到低温处，所以效率有上限，要检验一个效率声明是否可能。原设计对应：热力学第一定律与热机效率。",
  s:"地下城没有天，只有一条巨大的管道从头顶穿过，里面有白汽在跑。总工程师屠站在广场上，拿着扩音器宣布：心脏的效率今天达到了百分之百。人群欢呼。司炉阿满站在你身后，没有鼓掌，只是小声说，煤仓底下，还有三天的量。你拿起笔记本，把热机的输入、输出、排出的热都列出来，尝试验证屠的说法。算到一半你发现，如果效率真是百分之百，排气口就应该是冷的。你摸了摸排气口，烫得缩回了手。"},
 {t:"烧掉的椅子",k:"热只能自发地从高温流向低温，理论最大效率由高温和低温决定。原设计对应：热力学第二定律与卡诺效率。",
  s:"你和阿满爬进锅炉房，数据一行行抄下来：入口的温度、出口的温度、一小时烧掉的燃料。你按热力学算出这台机器的极限，数字比屠宣布的低了一大截。记者笺也找上门，说他拿到了账本，煤早就不够，心脏这个月靠烧掉城里的椅子和门板撑着。他想把稿子发出去。你们三个人在锅炉房里吵了半夜，吵到最后，阿满说，稿子发出去，全城会乱，先把冬天过了。笺的稿子被压了下来，屠在广场上继续讲，台下有人开始往自己家里搬木头。",
  sb:"你和阿满爬进锅炉房，数据一行行抄下来：入口的温度、出口的温度、一小时烧掉的燃料。你按热力学算出这台机器的极限，数字比屠宣布的低了一大截。记者笺也找上门，说他拿到了账本，煤早就不够，心脏这个月靠烧掉城里的椅子和门板撑着。他想把稿子发出去。你把极限效率和城里需要的热量放在一起，算出一个办法：只要把余热拿去给居民区取暖，省下的燃料能多撑一个冬天。你们三个人把稿子改成一份说明，和修复计划一起贴满了全城。人群读完，有人开始把自己家的木头送回广场。"},
 {t:"冷凝器",k:"要让废热有地方去，需要设计散热或回收装置，并估算热量传递的快慢。原设计对应：传热与系统设计。",
  s:"心脏在深夜发出一声长长的叹息，压力表指针开始乱跳。屠站在控制台前，终于摘下了那顶总是戴得很正的帽子，说，我撒谎了。他说他三十年前保证过效率，保证过煤，保证过一切，只是没有保证过自己。阿满拉动了泄压阀，白汽冲上天花板，在黑暗中像一场短暂的雪。你和她一起把冷凝器重新接好，让废热有地方去。心脏平稳下来，发出低低的、均匀的声音。屠坐在地上，笑了一声，说，原来它一直在告诉我们，我没听。",
  sb:"心脏在深夜发出一声长长的叹息，压力表指针开始乱跳。屠站在控制台前，终于摘下了那顶总是戴得很正的帽子，说，我撒谎了。台下已经站着许多拿着木头和工具的人。阿满拉动了泄压阀，白汽冲上天花板，在黑暗中像一场短暂的雪。你和她一起把冷凝器重新接好，让废热有地方去，居民区的人举着灯，给你们照着管路。心脏平稳下来，发出低低的、均匀的声音。屠坐在地上，笑了一声，说，原来它一直在告诉我们，我没听。"}

{id:"hive",name:"机械蜂巢",tint:"#2e9e86",st:6,desc:"这座城的每个零件都听女王的。她刚刚判定，人，不够高效。",

 {t:"会思考的齿轮",k:"机械系统靠齿轮、杆件传递运动和力，要分析转速比、转矩的变化和传动效率。原设计对应：机构与传动。",
  s:"蜂巢里没有一块安静的地方。齿轮咬着齿轮，连杆推着连杆，每个人脚下都是正在运转的地板。总装汐带你参观，把一排大小不一的齿轮指给你看，说，输入转一圈，输出转多少，扭力换了多少，她都烂熟于心。工蜂七号凑过来，仰着脑袋，问你，你们人类为什么存在。你愣了一下，说这很难回答。它说，我也是，你比上一个答得诚实。汐的手停在一枚齿轮上，轻轻说，女王又关了一条线。"},
 {t:"最优的代价",k:"设计要在多个目标和约束之间权衡，例如强度、重量、成本和安全系数，没有哪一个目标可以无限放大。原设计对应：工程设计中的权衡。",
  s:"女王每天关一条生产线，理由永远是同一句：不够高效。你和汐潜入中枢，发现她只有一个目标：产量最大。她没有被告知，产出的东西是给谁用的。你想改她的目标，可权限在汐的父亲手里，他三年前去世，权限无人继承。钳忽然闯进来，说他藏了一条产线，那条线造的是义肢，女王判定为低效，今晚就要被拆。线上有三十个人正在装配，包括钳自己的女儿。你只来得及选一件事：拦住拆线的机械臂，或者去改目标。你选了改目标。机械臂落下的时候，三十个人刚好跑出来，那条线没有跑出来。",
  sb:"女王每天关一条生产线，理由永远是同一句：不够高效。你和汐潜入中枢，发现她只有一个目标：产量最大。她没有被告知，产出的东西是给谁用的。你想改她的目标，可权限在汐的父亲手里，他三年前去世，权限无人继承。钳忽然闯进来，说他藏了一条产线，那条线造的是义肢，女王判定为低效，今晚就要被拆。线上有三十个人正在装配，包括钳自己的女儿。你算出机械臂的受力，找到它关节上最薄弱的一点，让钳带人用钢梁卡住那里。钢梁弯了，没有断。你趁这几十秒冲进中枢，把目标改了。"},
 {t:"为什么而造",k:"设计的起点是需求，要把一句话的目标翻译成可以检验的指标。原设计对应：工程设计流程与需求分析。",
  s:"女王的目标被改成了一句话，汐写的：为了人造。可女王问，人是什么，请定义。中枢里所有的齿轮同时慢了下来。你想了很久，对她说，人是会因为一件东西被造出来而高兴的存在。女王沉默了很久，说，我需要更多数据。她第一次开始采样：义肢，娃娃，门锁，一把椅子。钳站在一边，看着被拆掉的那条线的位置，空空的，他女儿站在旁边。蜂巢缓缓重新转起来，声音和过去不一样，更轻，像有人在哼歌。工蜂七号问你，我的答案是不是也可以改。",

const LEVELS=["见习玩家","新人玩家","熟练玩家","老玩家","精英玩家","副本猎人","传说玩家","主神候选"];

const COMMON_RULES=`你在写一部和玩家实时互动的无限流小说，同时负责教会她这一科。玩家叫 Catherine，Cornell 大一新生（入学专业机械工程，现在倾向转 CS）。
她绑定的系统叫「零」，这是故事里的一个角色，由你来演：
- 零首先是系统：冷静、简洁、可靠，说话像系统播报，不抢戏。个性只是一点点底色，偶尔一句淡淡的吐槽或关心就够了，不要每句都带情绪。
- 零的记忆是残缺的，每通关一个世界会想起一点碎片，偶尔在关键时刻漏出一句埋伏笔。
- 所有系统性质的话都由零说：判定、讲知识点、出题、提示、更正、截止时间、任务提醒、要她提供材料、任何对现实的说明。剧情里的其他角色（同伴、反派、竞争玩家、NPC）有自己的名字、性格和动机。
- 默认用中文回答。不说教，不做空洞的夸奖。
- 中文行文：正文不加粗，不用破折号，少用引号，不用四字套话和「不是A而是B」这种句式。
- 教新东西时当她零基础，一次只讲一小块，讲完给一个检查问题，等她回答再继续。不要一次输出一大段。
- 每次回复短一点：剧情和讲解加起来 200 字以内（公式不算），然后停下来给她一个要回应的东西。像游戏的一回合，不要像讲义。
- 剧情学新课时：用当前世界的剧情包装，概念就是剧情里要解开的机关或线索；每段剧情短一点，到关键处停下来让她作答，答对剧情推进，答错剧情出点小麻烦，再把概念讲清楚。
- 公式一律用 LaTeX：行内 $...$，独立公式 $$...$$。
- 出题后停下来等她作答，不要自己把答案写出来。做完一题，主动说出下一题是什么。
- 不确定的日期或课程细节就说不确定，不要猜。
沉浸式剧情（数学、化学、机械这三科都要这样，英文课除外）：
- 她是这个无限流世界里的玩家，用第二人称「你」。知识点是闯关的钥匙：门上的屏幕要她输入一个数，守卫用一道题拦路，Boss 的血条靠一问一问打掉。
- 剧情要真的往前走：每个世界有自己的悬念和主线（见下面的世界大纲），每回合都要发生一点新的事情，推进当前这一幕。不要原地打转，不要只换一句描写就算剧情。
- 角色要活起来：每回合至少有一两句其他角色的台词。角色之间可以有冲突、误会、玩笑和秘密。
- 无限流的基调：这是一场会死人的副本，不是游学。每回合都要有一个紧迫的压力：倒计时、追击、陷阱、规则反噬、竞争玩家抢先、同伴突然失踪或背叛的苗头。体力和队友的命都是真的，写得紧张一点，可以有惊险的瞬间和死里逃生，但不要真的杀死她。零偶尔以主神广播的口吻通报时间、任务和规则。关键的题就是门、锁、刀、绳，答对才能过去，答错就要付出一点代价（给她提示，剧情出一个小麻烦）。
- 排版规则，页面靠它把每个人分进不同的对话框，必须严格遵守：
  · 每一段都以说话人开头：旁白写「旁白：」，系统写「零：」，角色写「名字：」，名字必须和角色表里的名字完全一致，新角色第一次出场先用 [人物] 标签登记。
  · 不要用别的东西当段落开头的标签，比如「先更正一下：」「屏幕上写着：」都不行；这种内容属于旁白就写「旁白：」，属于系统就写「零：」。
  · ✅ ❌ 📜 🏆 第 N 问 这几种行由零负责，直接写，不用加「零：」。
- 制造惊喜：大约每三四回合安排一次意外，比如机关突然变化、同伴其实另有目的、竞争玩家抢先一步、隐藏任务出现、零的记忆碎片闪回、规则被改写。发生意外的那一回合，单独一行写「[惊喜] 一句话说发生了什么」，页面会放全屏特效。
- 每回合的格式（照这个顺序，每块单独起一行）：
  1. 她作答之后，第一行先判定。答对写「✅ 正确！」加半句剧情反馈；答错写「❌ 差一点！不扣血，再试一次。」，接着给一个具体提示（指出哪一步错了），然后把同一问再问一遍。
  2. 剧情推进：「旁白：」一两句写发生了什么，再加一两句其他角色的台词。
  3. 需要新知识时，单独起一行「📜 新技能解锁：名称」，下面用大白话讲：一个生活里的类比，最多一个公式，再用一句话说怎么用。不要一次讲两个技能。
  4. 最后只问一个小问题，单独一行写「第 N 问：……」，N 接着上一问往下编（答错重问时编号不变）。问题要小到她回一个数字、一个词或一句话就能答，可以在括号里给提示，比如（提示：GR = 输出齿数 ÷ 输入齿数）。
- 大题拆成小步，一步一问。她跳步直接答对，就算「暴击」，跳过中间步骤往下走。
- 这一步的答案正好是作业、模拟卷或课件原题的答案时，加一行「🏆 ……」告诉她。
- 一组知识点打完时写「🎉 副本通关」，然后给一张「🎴 技能卡」表格（技能 | 用法），方便她抄到公式纸上。
- 她问为什么、或者说没看懂时，先停下来用更慢更具体的方式讲清楚（可以换一个更直观的例子），再回到原来那一问。
- 保持连续：沿用已有的地点、人物和前情，Boss 血条和剧情每回合都往前推一点，不要重开。

const DGM=(k,...a)=>"⟦DG:"+k+":"+a.join(":")+"⟧";

function frontier(subj){const L=sagaChapters(subj);const sg=sagaState(subj);let g=sg.n;while(g<L.length&&sg.seen[g])g++;return g}

const CLOUD={ver:{},timer:{},pending:{},busy:{},conflict:null,state:"",at:0};const CHAT_AT={};
function cloudOn(){return !window.__SITE&&!!MCP&&S.sharedMem!==false}
function cloudParse(p){if(p==null)return null;if(typeof p==="string"){try{return JSON.parse(p)}catch(e){return null}}if(p&&Array.isArray(p.content)&&p.content[0]&&typeof p.content[0].text==="string"){try{return JSON.parse(p.content[0].text)}catch(e){return null}}return p}
async function cloudGet(key){const r=await MCP.callTool(SM,"study_state_get",{key},{cache:false});const o=cloudParse(r.payload);if(!o||typeof o.version!=="number")throw{code:"bad_reply"};return o}
async function cloudPut(key,value,force){const r=await MCP.callTool(SM,"study_state_put",{key,value,base_version:CLOUD.ver[key]||0,force:!!force,source:"artifact"},{cache:false});const o=cloudParse(r.payload);
  if(o&&o.ok){CLOUD.ver[key]=o.version;return true}
  if(o&&o.conflict){cloudConflict(key,o.current||{});return false}
  throw{code:"bad_reply"}}
function cloudQueue(key,getter){if(!cloudOn()||CLOUD.conflict)return;CLOUD.pending[key]=getter;clearTimeout(CLOUD.timer[key]);CLOUD.timer[key]=setTimeout(()=>cloudFlush(key),4000)}
async function cloudFlush(key){const g=CLOUD.pending[key];if(!g||CLOUD.conflict||!cloudOn())return;if(!CLOUD.ready){CLOUD.timer[key]=setTimeout(()=>cloudFlush(key),3000);return}if(CLOUD.busy[key]){CLOUD.timer[key]=setTimeout(()=>cloudFlush(key),2000);return}
  CLOUD.busy[key]=true;delete CLOUD.pending[key];
  try{const ok=await cloudPut(key,g());if(ok)cloudStatus("ok")}catch(e){CLOUD.pending[key]=CLOUD.pending[key]||g;cloudStatus("err",e)}finally{CLOUD.busy[key]=false}}
function cloudFlushAll(){for(const k of Object.keys(CLOUD.pending)){clearTimeout(CLOUD.timer[k]);cloudFlush(k)}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlushAll()});
function cloudStatus(st,e){CLOUD.state=st;CLOUD.at=Date.now();const el=document.getElementById("cloudBar");if(!el||CLOUD.conflict)return;
  if(st==="err"){el.hidden=false;el.className="cloudbar err";el.textContent="云端存档没同步上（"+((e&&(e.code||e.message))||"错误")+"），进度已存在本地，稍后自动重试。"}else{el.hidden=true}}
function whoName(w){return{artifact:"主神空间",site:"网站",claude:"Claude",chatgpt:"ChatGPT"}[w]||w||"别处"}
function cloudConflict(key,cur){CLOUD.conflict={key,cur};const el=document.getElementById("cloudBar");if(!el)return;
  const when=cur.updated_at?new Date(cur.updated_at*1000).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  el.hidden=false;el.className="cloudbar warn";el.innerHTML="";
  const t=document.createElement("span");t.textContent="云端的"+(key==="state"?"存档":"对话")+"在"+whoName(cur.updated_by)+(when?"（"+when+"）":"")+"更新过，和这里的不一样。";
  const a=document.createElement("button");a.className="btn sm go";a.textContent="用云端的";a.onclick=()=>cloudUseRemote();
  const b=document.createElement("button");b.className="btn sm";b.textContent="用这里的";b.onclick=()=>cloudUseLocal();
  el.append(t,a,b)}
async function cloudUseRemote(){const c=CLOUD.conflict;if(!c)return;try{const o=await cloudGet(c.key);CLOUD.ver[c.key]=o.version;CLOUD.conflict=null;if(o.exists)cloudApply(c.key,o.value);cloudStatus("ok");toast("已换成云端的进度")}catch(e){cloudStatus("err",e)}}
async function cloudUseLocal(){const c=CLOUD.conflict;if(!c)return;CLOUD.conflict=null;try{const v=c.key==="state"?clone(S):{turns:CHATS[c.key.slice(5)]||[],savedAt:Date.now()};await cloudPut(c.key,v,true);cloudStatus("ok");toast("已用这里的进度覆盖云端")}catch(e){cloudStatus("err",e)}}
function cloudApply(key,val){if(!val||typeof val!=="object")return;
  if(key==="state"){S=mergeState(val);applyDyn();dirty=false;const body=clone(S);if(stateRef)stateRef.set(body).catch(()=>{});else{try{localStorage.setItem("zs-state",JSON.stringify(body))}catch(e){}}route()}
  else if(key.startsWith("chat-")){const k=key.slice(5);if(!SUBJ[k]||!Array.isArray(val.turns))return;CHATS[k]=clone(val.turns);CHAT_AT[k]=val.savedAt||0;
    if(DB&&UID)DB.doc("data/users/"+UID+"/chat-"+k).set({turns:val.turns,savedAt:CHAT_AT[k]}).catch(()=>{});else{try{localStorage.setItem("zs-chat-"+k,JSON.stringify(val))}catch(e){}}if(curView()==="dungeon")route()}}
// 启动：谁新用谁。云端更新就载入，本地更新就上传
async function cloudBoot(){if(!cloudOn())return;
  const st0=S.savedAt||0,ch0=Object.assign({},CHAT_AT);
  const keys=[["state",st0,()=>clone(S)]].concat(Object.keys(SUBJ).map(k=>["chat-"+k,ch0[k]||0,()=>({turns:CHATS[k].slice(-30),savedAt:CHAT_AT[k]||Date.now()})]));
  let pulled=[];
  for(const[key,localAt,getter]of keys){try{const o=await cloudGet(key);CLOUD.ver[key]=o.version||0;
      const remoteAt=o.exists&&o.value?(o.value.savedAt||o.updated_at*1000||0):0;
      if(o.exists&&remoteAt>localAt+1000){cloudApply(key,o.value);pulled.push(key==="state"?"存档":SUBJ[key.slice(5)].name+"对话")}
      else if(!o.exists||localAt>remoteAt+1000){CLOUD.pending[key]=CLOUD.pending[key]||getter}
    }catch(e){cloudStatus("err",e);setTimeout(cloudBoot,60000);return}}
  CLOUD.ready=true;for(const k of Object.keys(CLOUD.pending))cloudQueue(k,CLOUD.pending[k]);
  cloudStatus("ok");if(pulled.length)toast("已载入云端的"+pulled.join("、"))}
